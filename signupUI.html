<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogWatch Sign Up</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="signup.css">
  <link rel="stylesheet" href="hogwatch-ui.css">
  <link rel="stylesheet" href="page-transitions.css">
</head>
<body>

  <div class="signup-card">
    <div class="header">
      <h1>HogWatch</h1>
      <p>Monitor. Manage. Protect.</p>
    </div>

    <div class="tabs-container">
      <div class="tabs">
        <button class="tab-btn" id="loginTab">
          <i class="fa-solid fa-user"></i> Log in
        </button>
        <button class="tab-btn active" id="signupTab">
          <i class="fa-solid fa-user-plus"></i> Sign up
        </button>
      </div>
    </div>

    <form id="signupForm">
      
      <!-- Side-by-side Name Fields -->
      <div class="form-row">
        <div class="form-group half-width">
          <label for="firstName">First name</label>
          <div class="input-wrapper no-icon">
            <input type="text" id="firstName" placeholder="Enter First Name" required>
          </div>
        </div>
        <div class="form-group half-width">
          <label for="lastName">Last name</label>
          <div class="input-wrapper no-icon">
            <input type="text" id="lastName" placeholder="Enter Last Name" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="username" placeholder="Choose a username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" placeholder="name@farm.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile number</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i> <!-- Mockup shows envelope here -->
          <input type="tel" id="mobile" placeholder="+1 (555) 000-0000" required>
        </div>
      </div>

      <div class="form-group">
        <label for="passwordField1">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="passwordField1" placeholder="Create a password" required>
          <i class="fa-regular fa-eye toggle-password" data-target="passwordField1" style="z-index: 10; cursor: pointer; pointer-events: auto;"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="passwordField2">Confirm password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="passwordField2" placeholder="Re-enter password" required>
          <i class="fa-regular fa-eye toggle-password" data-target="passwordField2" style="z-index: 10; cursor: pointer; pointer-events: auto;"></i>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        Create account <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="footer">
      Already have an account? <a href="loginUI.html">Log in</a>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
