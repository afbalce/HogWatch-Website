<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogWatch - Security Settings</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="hogwatch-ui.css">
  <link rel="stylesheet" href="page-transitions.css">
</head>
<body data-page="settings">

  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="header-titles">
          <h1>Settings</h1>
          <p>Preferences, notifications, account, and alert thresholds</p>
        </div>
      </header>

      <!-- 5-Page Navigation -->
      <div class="settings-tabs">
        <a href="settings.html" class="tab-link">Account</a>
        <a href="settings-security.html" class="tab-link">Security</a>
        <a href="settings-alerts.html" class="tab-link">Alerts</a>
        <a href="settings-cameras.html" class="tab-link">Cameras</a> <!-- Added link -->
        <a href="settings-notifications.html" class="tab-link">Notifications</a>
      </div>
      
      <div class="settings-container">
        <!-- Security Card -->
        <div class="settings-card">
          <h3>Security</h3>
          <p class="card-subtitle">Protect your account access.</p>

          <div class="setting-row" style="padding-bottom: 24px; border-bottom: 1px solid #E5E7EB; margin-bottom: 24px;">
            <div class="setting-info">
              <strong>Two-Factor Authentication (2FA)</strong>
              <span>Require a code sent to your phone on login</span>
            </div>
            <label class="toggle">
              <input type="checkbox" id="tfaToggle">
              <span class="slider"></span>
            </label>
          </div>

          <form id="passwordForm">
            <h4 style="font-size: 14px; margin-bottom: 16px; color: #111827;">Change Password</h4>
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" class="form-input" placeholder="Enter current password" required>
            </div>
            <div class="form-group">
              <label>New Password</label>
              <input type="password" class="form-input" placeholder="At least 8 characters" required>
            </div>
            <div class="form-group">
              <label>Confirm New Password</label>
              <input type="password" class="form-input" placeholder="Re-enter new password" required>
            </div>
            <button type="submit" class="btn-secondary" style="margin-top: 12px;">Update Password</button>
          </form>
        </div>
      </div>

    </main>
  </div>
      
  <div id="customAlert" class="custom-alert">
    <i id="alertIcon" class="fa-solid fa-circle-info"></i>
    <span id="alertMessage" class="alert-text">Message goes here</span>
  </div>

  <script src="settings.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
