<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogWatch</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="hogwatchstyle.css">
  <link rel="stylesheet" href="hogwatch-ui.css">
  <link rel="stylesheet" href="page-transitions.css">
</head>
<body>

    <!-- ================= CUSTOM ALERT TOAST ================= -->
  <div id="customAlert" class="custom-alert">
    <i id="alertIcon" class="fa-solid fa-circle-info"></i>
    <span id="alertMessage" class="alert-text">Message goes here</span>
  </div>

  <!-- ================= LOGIN VIEW ================= -->
  <div class="auth-card form-view active-view" id="login-view">
    <div class="header">
      <h1>HogWatch</h1>
      <p>Monitor. Manage. Protect.</p>
    </div>

    <div class="tabs-container">
      <div class="tabs">
        <button class="tab-btn active"><i class="fa-solid fa-user"></i> Log in</button>
        <button class="tab-btn" id="signupTab"><i class="fa-solid fa-user-plus"></i> Sign up</button>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email or mobile number</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="text" placeholder="name@farm.com or +1 555 1234" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="passwordField" placeholder="Enter password" required>
          <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <div class="options">
        <label class="checkbox-container">
          <input type="checkbox" checked>
          <span class="checkmark"></span> Remember me
        </label>
        <a href="forgotpassword.html" class="forgot-password switch-to-forgot">Forgot password?</a>
      </div>

      <div class="divider"><span>or continue with</span></div>

      <div class="social-login">
        <button type="button" class="social-btn"><i class="fa-brands fa-facebook-f" style="color: #1877F2;"></i></button>
        <button type="button" class="social-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
        </button>
      </div>

      <button type="submit" class="submit-btn">Log in <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <div class="footer">New here? <a href="signupUI.html">Create an account</a></div>
  </div>

  <script src="login.js"></script>
</body>
</html>
