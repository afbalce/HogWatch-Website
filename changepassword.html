<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogWatch Change Password</title>
  
  <!-- Inter Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="changepassword.css">
  <link rel="stylesheet" href="hogwatch-ui.css">
  <link rel="stylesheet" href="page-transitions.css">
</head>
<body>

  <div class="change-password-card">
    <div class="header">
      <h1>HogWatch</h1>
      <p>Create new password.</p>
    </div>

    <p class="description-text">
      Your new password must be different from previous used passwords.
    </p>

    <form id="changePasswordForm">
      <div class="form-group">
        <label for="newPassword">New password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="newPassword" placeholder="Must be at least 8 characters" required>
          <i class="fa-regular fa-eye toggle-password" data-target="newPassword" style="z-index: 10; cursor: pointer; pointer-events: auto;"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
          <i class="fa-regular fa-eye toggle-password" data-target="confirmPassword" style="z-index: 10; cursor: pointer; pointer-events: auto;"></i>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        Reset Password <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
    
    <div class="footer">
      <a href="loginUI.html" id="backToLoginBtn">
        <i class="fa-solid fa-arrow-left"></i> Back to log in
      </a>
    </div>
  </div>

  <script src="changepassword.js"></script>
</body>
</html>
