<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogWatch - Account Settings</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="hogwatch-ui.css">
  <link rel="stylesheet" href="page-transitions.css">
</head>
<body data-page="settings">

  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="header-titles">
          <h1>Settings</h1>
          <p>Preferences, notifications, account, and alert thresholds</p>
        </div>
      </header>

     <!-- 5-Page Navigation -->
      <div class="settings-tabs">
        <a href="settings.html" class="tab-link">Account</a>
        <a href="settings-security.html" class="tab-link">Security</a>
        <a href="settings-alerts.html" class="tab-link">Alerts</a>
        <a href="settings-cameras.html" class="tab-link">Cameras</a> <!-- Added link -->
        <a href="settings-notifications.html" class="tab-link">Notifications</a>
      </div>

      <div class="settings-container">
        <!-- Account Profile Card -->
        <div class="settings-card">
          <h3>Account Profile</h3>
          <p class="card-subtitle">Manage your personal information.</p>
          
          <div class="profile-header">
            <div class="avatar">JD</div>
            <div>
              <strong>John Doe</strong>
              <span>Farm Manager</span>
            </div>
          </div>

          <form id="accountForm">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" class="form-input" value="John Doe">
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" class="form-input" value="john.doe@hogwatch.com">
            </div>
            <div class="form-group">
              <label>Mobile Number</label>
              <input type="tel" class="form-input" value="+1 (555) 123-4567">
            </div>
            <button type="submit" class="btn-primary" style="margin-top: 12px;">Update Profile</button>
          </form>
        </div>
      </div>

    </main>
  </div>
      
  <div id="customAlert" class="custom-alert">
    <i id="alertIcon" class="fa-solid fa-circle-info"></i>
    <span id="alertMessage" class="alert-text">Message goes here</span>
  </div>

  <script src="settings.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
