<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogWatch - Pen Monitoring</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="pen-monitoring.css">
  <link rel="stylesheet" href="hogwatch-ui.css">
  <link rel="stylesheet" href="page-transitions.css">
</head>
<body data-page="pen-monitoring">

  <div class="app-layout">
    
    <!-- Reusable Sidebar Injected Here -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="monitor">
        <header class="page-header">
          <div><h1>Pen monitoring</h1><p>Piggery A</p></div>
          <a class="secondary" href="pen-management.html">Manage pens</a>
        </header>

        <nav id="pen-picker" aria-label="Select a pen"></nav>

        <p id="no-pens" hidden>No pens are configured. Open Pen Management to add one.</p>
        <section class="readings panel" aria-labelledby="selected-name">
          <header class="readings-head">
            <div class="heading-pair"><h2 id="selected-name"></h2><span id="pen-status" class="badge"></span></div>
            <span class="reading-time" id="reading-time"></span>
          </header>
          <div id="metrics" class="metrics"></div>
          <p class="assigned-sensors" id="assigned-sensors"></p>
        </section>

        <section class="panel alert-panel" aria-labelledby="alerts-title">
          <header class="panel-head"><h2 id="alerts-title">Active alerts <span id="alert-count"></span></h2>
            <a href="alertsmanagement.html">Manage alerts</a></header>
          <div id="pen-alerts"></div>
        </section>

        <div class="support-panels">
          <details class="panel" id="history-panel" open>
            <summary>Temperature trend <span class="detail-meta">24 hours</span></summary>
            <div class="detail-body">
              <div id="trend"><svg viewBox="0 0 700 180" class="trend-svg" role="img" aria-label="Selected pen temperature trend over 24 hours, ending at 28.4 degrees Celsius">
                <defs>
                  <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
                    <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
                  </linearGradient>
                </defs>
                <!-- Critical & Warning Band Background Highlights -->
                <rect x="0" y="0" width="700" height="35" fill="#FEF2F2" opacity="0.6"/>
                <rect x="0" y="35" width="700" height="40" fill="#FFFBEB" opacity="0.5"/>
                <rect x="0" y="75" width="700" height="105" fill="#ECFDF5" opacity="0.4"/>
                
                <!-- Limit Dashed Line -->
                <line x1="0" y1="35" x2="700" y2="35" stroke="#EF4444" stroke-dasharray="4,4" stroke-width="1.5" />
                <text x="690" y="28" fill="#EF4444" font-size="11" text-anchor="end" font-weight="600">30 °C Limit</text>

                <!-- Data Path -->
                <path d="M 0 60 Q 60 45 120 70 T 240 65 T 360 85 T 480 75 T 600 50 L 680 38" fill="none" stroke="#111827" stroke-width="2.5" />
                <path d="M 0 60 Q 60 45 120 70 T 240 65 T 360 85 T 480 75 T 600 50 L 680 38 L 680 180 L 0 180 Z" fill="url(#chartFill)" />

                <!-- Node Dot & Tooltip -->
                <circle cx="680" cy="38" r="5" fill="#F97316" stroke="#FFFFFF" stroke-width="2" />
                <g transform="translate(620, 48)">
                  <rect x="0" y="0" width="75" height="22" rx="4" fill="#111827"/>
                  <text x="37.5" y="15" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">28.4 °C now</text>
                </g>
              </svg><div class="axis"><span>24 hours ago</span><span>Now</span></div></div>
              <p id="no-trend" class="empty"></p>
              <a href="analytics.html">Open analytics</a>
            </div>
          </details>
          <details class="panel" id="camera-panel" open>
            <summary>Camera feed</summary>
            <div class="detail-body">
              <label for="camera-source">Camera</label>
              <select id="camera-source"></select>
              <div class="feed-stage" id="feed-stage">
                <p id="feed-message" role="status"></p>
                <button type="button" id="start-feed" class="secondary">Start camera</button>
              </div>
              <div class="camera-tools">
                <button class="secondary" id="stop-feed" type="button" hidden>Stop feed</button>
                <button class="secondary" id="snapshot" type="button" disabled>Snapshot</button>
                <button class="secondary" id="fullscreen" type="button" disabled>Full screen</button>
              </div>
              <a href="devicemanagement.html">Manage cameras</a>
              <div id="sample-behavior" hidden><p>Sample behavior · CAM-3</p>
                <dl><div><dt>Activity</dt><dd>Normal</dd></div><div><dt>Huddling</dt><dd>Not detected</dd></div><div><dt>Coughing</dt><dd>2 events / hr</dd></div></dl>
              </div>
            </div>
          </details>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="sidebar.js"></script>
  <script src="device-inventory.js"></script>
  <script src="pen-camera.js"></script>
  <script src="pen-monitoring.js"></script>
</body>
</html>
