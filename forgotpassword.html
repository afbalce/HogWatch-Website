<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogWatch Forgot Password</title>
  
  <!-- Inter Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="forgotpassword.css">
  <link rel="stylesheet" href="hogwatch-ui.css">
  <link rel="stylesheet" href="page-transitions.css">
</head>
<body>

  <div class="forgot-card">
    <div class="header">
      <h1>HogWatch</h1>
      <p>Reset your password.</p>
    </div>

    <!-- Description text -->
    <p class="description-text">
      Enter the email address or mobile number associated with your account, and we'll send you a link to securely reset your password.
    </p>

    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="resetInput">Email or mobile number</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="text" id="resetInput" placeholder="name@farm.com or +1 555 1234" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        Send reset link <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
    
    <div class="footer">
      <a href="loginUI.html" id="backToLoginBtn">
        <i class="fa-solid fa-arrow-left"></i> Back to log in
      </a>
    </div>
  </div>

  <script src="forgotpassword.js"></script>
</body>
</html>
